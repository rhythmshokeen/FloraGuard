name: CI/CD Pipeline - Plant Disease Classification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install onnxscript flake8 pytest pytest-cov

      - name: Code Quality & Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=PlantVillage,.git,__pycache__,.ipynb_checkpoints
          # Exit-zero treats all other warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics --exclude=PlantVillage,.git,__pycache__,.ipynb_checkpoints

      - name: Execute Automated Test Suite (CPU)
        run: |
          pytest -v --cov=src --cov-report=term-missing

      - name: Verify Checkpoint Loading & Architecture
        run: |
          python -c "
          from src.model import load_checkpoint
          model, meta = load_checkpoint('plant_disease_resnet50.pth', device='cpu')
          assert meta['num_classes'] == 15, 'Invalid class count'
          print('CI Validation: Checkpoint verified successfully.')
          "

      - name: Validate API & Smoke Predictor
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.api import app
          with TestClient(app) as client:
              res = client.get('/health')
          assert res.status_code == 200
          print('CI Validation: API Health check verified.')
          "

  docker-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: plant-disease-mlops:latest
