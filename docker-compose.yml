version: '3.8'

services:
  api:
    build: .
    container_name: plant_disease_api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./mlflow.db:/app/mlflow.db
    environment:
      - PORT=8000
    restart: unless-stopped

  ui:
    build: .
    container_name: plant_disease_ui
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./mlflow.db:/app/mlflow.db
    depends_on:
      - api
    restart: unless-stopped

  mlflow:
    build: .
    container_name: plant_disease_mlflow
    command: ["mlflow", "ui", "--backend-store-uri", "sqlite:///mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    restart: unless-stopped
